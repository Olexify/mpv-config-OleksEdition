##############################################################################
# input.conf
#
# A line ending in a menu path (hash, bang, then "Folder > Item") also builds
# the right-click wheel and the uosc menu. A commented-out line still adds its
# menu entry, it just has no key bound to it. Don't write that marker inside
# a comment: both menus would pick it up as an entry.
#
# A keyed line ending in a plain "# description" shows up on the shortcuts
# screen (the ? key) under General.
##############################################################################

### Mouse and window ###

MBTN_LEFT cycle pause; script-message-to uosc flash-pause-indicator                            # play / pause
ALT+MBTN_LEFT ignore                                                                           # hold and drag to move the window
MBTN_RIGHT script-binding radial_menu/open                                                     # wheel menu: hold and point, or tap
Ctrl+MBTN_RIGHT script-binding uosc/menu-blurred                                               # list menu, with search

TAB script-message-to uosc toggle-ui #@press
TAB script-message-to uosc toggle-ui #@release

# Previous / next file; hold to keep skipping (scripts/playlist_repeat.lua).
UP script-binding playlist_repeat/pl-prev-hold                                                 # previous file, hold to skip quickly
DOWN script-binding playlist_repeat/pl-next-hold                                               # next file, hold to skip quickly


### Submenu shortcuts ###

ALT+a script-message-to uosc show-submenu-blurred "Open"                                       # Open menu
ALT+z script-message-to uosc show-submenu-blurred "Audio"                                      # Audio menu
ALT+x script-message-to uosc show-submenu-blurred "Subtitles"                                  # Subtitles menu
ALT+s script-message-to uosc show-submenu-blurred "Video > Shaders"                            # Shaders menu


### Open ###

b script-binding uosc/open-file                                                                #! Open > Open File
h script-binding memo-history                                                                  #! Open > Recently Played
# script-binding uosc/show-in-directory                                                        #! Open > Open in File Explorer
# script-binding uosc/playlist                                                                 #! Open > Playlist
# script-binding uosc/chapters                                                                 #! Open > Chapters
# script-binding uosc/load-audio                                                               #! Open > Load Audio File


### Sort ###
# The choice is remembered; the active one gets a dot in the wheel.

ALT+p script-binding sort_playlist/menu                                                        # sort menu (also the button next to the playlist)
# script-binding sort_playlist/explorer                                                        #! Sort > Match Explorer
# script-binding sort_playlist/name-asc                                                        #! Sort > Name A-Z
# script-binding sort_playlist/name-desc                                                       #! Sort > Name Z-A
# script-binding sort_playlist/date-new                                                        #! Sort > Newest First
# script-binding sort_playlist/date-old                                                        #! Sort > Oldest First
# script-binding sort_playlist/subfolders                                                      #! Sort > Include Subfolders
# script-binding playlist_repeat/wrap                                                          #! Sort > Wrap Up/Down


### Video ###

g cycle interpolation                                                                          #! Video > Toggle Interpolation
ALT+d cycle deband                                                                             #! Video > Toggle Deband
Ctrl+d script-binding autodeint/autodeint                                                      #! Video > Auto Deinterlace
# script-binding uosc/video                                                                    #! Video > Select Video Track
# apply-profile Deband-Medium                                                                  #! Video > Filters > Deband (Medium)
# apply-profile Deband-Strong                                                                  #! Video > Filters > Deband (Strong)
ALT+v vf toggle deblock=filter=weak:block=4                                                    #! Video > Filters > Toggle Deblocking


### Video > Shaders ###

n change-list glsl-shaders toggle ~~/shaders/nlmeans_luma.glsl                                 #! Video > Shaders > Denoise
c change-list glsl-shaders clr all                                                             #! Video > Shaders > Clear All
# change-list glsl-shaders toggle ~~/shaders/adasharp_luma.glsl                                #! Video > Shaders > Sharpen
# change-list glsl-shaders toggle ~~/shaders/krigbl.glsl                                       #! Video > Shaders > igv > krigbl
# change-list glsl-shaders toggle ~~/shaders/F8.glsl                                           #! Video > Shaders > igv > FSRCNNX 8
# change-list glsl-shaders toggle ~~/shaders/F16.glsl                                          #! Video > Shaders > igv > FSRCNNX 16
# change-list glsl-shaders toggle ~~/shaders/ssimsr.glsl                                       #! Video > Shaders > igv > SSimSuperRes
# change-list glsl-shaders toggle ~~/shaders/ssimds.glsl ; no-osd set linear-downscaling no    #! Video > Shaders > igv > SSimDownscaler
# change-list glsl-shaders toggle ~~/shaders/A4K_Restore_CNN_Soft_M.glsl                       #! Video > Shaders > Anime > A4K Restore
# change-list glsl-shaders toggle ~~/shaders/AniSD_ArtCNN_C4F32_i4.glsl                        #! Video > Shaders > Anime > AniSD ArtCNN
# change-list glsl-shaders toggle ~~/shaders/Ani4Kv2_ArtCNN_C4F32_i2.glsl                      #! Video > Shaders > Anime > Ani4Kv2 ArtCNN
# change-list glsl-shaders toggle ~~/shaders/A4K_Clamp_Highlights.glsl                         #! Video > Shaders > Anime > A4K Clamp Highlights
# change-list glsl-shaders toggle ~~/shaders/nnedi3_nns32_win8x4.glsl                          #! Video > Shaders > nnedi3/ravu > nnedi3 32
# change-list glsl-shaders toggle ~~/shaders/nnedi3_nns64_win8x4.glsl                          #! Video > Shaders > nnedi3/ravu > nnedi3 64
# change-list glsl-shaders toggle ~~/shaders/ravu_z_ar_r3.glsl ; no-osd set cscale-antiring 0 ; set dscale-antiring 0 ; set cscale-antiring 0 #! Video > Shaders > nnedi3/ravu > ravu zoom ar r3


### Video > Profiles ###

CTRL+1 apply-profile FSRCNNX;show-text "Profile: FSRCNNX"                                      #! Video > Profiles > Toggle FSRCNNX profile
CTRL+2 apply-profile FSRCNNX+;show-text "Profile: FSRCNNX+"                                    #! Video > Profiles > Toggle FSRCNNX+ profile
CTRL+3 apply-profile Ravu-Zoom;show-text "Profile: Ravu-Zoom"                                  #! Video > Profiles > Toggle Ravu-Zoom profile
CTRL+4 apply-profile Ani4k;show-text "Profile: Ani4k"                                          #! Video > Profiles > Toggle Ani4K profile
CTRL+5 apply-profile AniSD;show-text "Profile: AniSD"                                          #! Video > Profiles > Toggle AniSD profile
CTRL+6 apply-profile Anime4K;show-text "Profile: Anime4K"                                      #! Video > Profiles > Toggle Anime4k profile
CTRL+7 apply-profile NNEDI3;show-text "Profile: NNEDI3"                                        #! Video > Profiles > Toggle NNEDI3 profile
CTRL+8 apply-profile NNEDI3+;show-text "Profile: NNEDI3+"                                      #! Video > Profiles > Toggle NNEDI3+ profile


### Audio ###

F1 af toggle "lavfi=[loudnorm=I=-14:TP=-3:LRA=4]" ; show-text "${af}"                          #! Audio > Dialogue
# af clr ""                                                                                    #! Audio > Clear Filters
# script-binding uosc/audio                                                                    #! Audio > Select Audio Track
# cycle audio-normalize-downmix                                                                #! Audio > Toggle Normalisation


### Subtitles ###

y script-binding uosc/load-subtitles                                                           #! Subtitles > Load
Y script-binding uosc/subtitles                                                                #! Subtitles > Select
ALT+b script-binding ytsub/load                                                                #! Subtitles > Download (YouTube)
# script-binding ytsub/auto                                                                    #! Subtitles > Download Automatically (YouTube)
ALT+j add sub-scale +0.05                                                                      #! Subtitles > Bigger
ALT+k add sub-scale -0.05                                                                      #! Subtitles > Smaller
z add sub-delay -0.1                                                                           #! Subtitles > Decrease Sub Delay
x add sub-delay  0.1                                                                           #! Subtitles > Increase Sub Delay


### Delete ###
# Both are two-step: the key arms it, Enter confirms, Esc cancels.

DEL script-binding trash_file/trash                                                            #! Delete > Move to Recycle Bin
Shift+DEL script-binding trash_file/delete                                                     #! Delete > Delete Permanently
Ctrl+z script-binding trash_file/undo                                                          #! Delete > Undo Last Trash


### Tools ###

? script-binding radial_menu/shortcuts                                                         #! Tools > Keyboard Shortcuts
/ script-binding console/enable                                                                #! Tools > Console
# script-binding uosc/open-config-directory                                                    #! Tools > Open Configuration File

a cycle window-minimized                                                                       #! Minimise
q quit-watch-later                                                                             #! Exit
