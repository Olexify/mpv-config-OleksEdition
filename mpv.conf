##############################################################################
# mpv.conf
#
# Layout:  Profiles -> Video -> Colour/Deband -> Audio -> Subtitles ->
#          Playback -> Window & OSD -> Paths -> Scratch
#
# Conditional and shader profiles live in profiles.conf.
# Key bindings and the uosc menu live in input.conf.
##############################################################################

### Profiles ###

include="~~/profiles.conf"


### Video ###

vo=gpu-next
gpu-api=d3d11
gpu-context=auto

# d3d11va (not -copy) is what d3d11va-zero-copy applies to; the two were
# previously contradicting each other. Switch to hwdec=d3d11va-copy if a
# filter or screenshot path needs frames back in system memory.
hwdec=d3d11va
hwdec-codecs=all
d3d11va-zero-copy=yes
d3d11-exclusive-fs=yes
vd-lavc-dr=yes


### Colour and deband ###

# Off by default; toggled with ALT+d, or use the Deband profiles in profiles.conf.
deband=no
deband-iterations=1
deband-threshold=48
deband-range=16
deband-grain=32

temporal-dither


### Audio ###

alang=ja,jp,jpn,jap,Japanese,en,eng,English

volume-max=200
audio-channels=7.1,5.1,stereo
audio-pitch-correction=yes
audio-normalize-downmix=yes
audio-file-auto=fuzzy


### Subtitles ###

slang=en,eng,English

sub-auto=all
sub-file-paths=sub;subs;subtitles
demuxer-mkv-subtitle-preroll=yes

sub-fix-timing=yes
blend-subtitles=yes
sub-ass-override=scale

sub-font=Clear Sans Bold
sub-scale=0.7
sub-margin-y=60
sub-blur=0.5
sub-gauss=1.5
sub-color='#eceff4'
sub-shadow-offset=0
sub-outline-size=1.15
sub-back-color='#2e3440'
sub-border-color='#2e3440'
sub-shadow-color='#2e3440'
sub-outline-color='#2e3440'


### Playback ###

keep-open=yes
loop-playlist=inf
image-display-duration=inf
save-position-on-quit=yes
# Resume position, tracks, volume etc. but never zoom or pan.
watch-later-options-remove=video-zoom,video-pan-x,video-pan-y,panscan


### Window and OSD ###

fs=yes
osc=no
snap-window
window-dragging=yes
# No Windows title bar: drag the video to move the window, and use the
# minimise / maximise / close buttons in the top bar. Edges still resize.
title-bar=no

osd-bar=no
osd-bold=yes
osd-font-size=37
osd-font='JetBrains Mono'


### Paths ###

watch-later-dir="~~/cache/watch_later"
gpu-shader-cache-dir="~~/cache/shaders_cache"


